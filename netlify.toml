# NOTE: redirect rules do NOT belong here. This file is not being applied on the
# production site — rules declared here returned 200 instead of redirecting, and
# /terms and /privacy were silently broken for months as a result. All redirects
# live in public/_redirects, which Vite copies to build/_redirects and which
# production demonstrably honours.
#
# If the netlify.toml issue is ever diagnosed (a stale base directory in the site's
# build settings is the usual cause), redirects can move back here — but move them,
# don't duplicate them. netlify.toml takes precedence over _redirects when both are
# applied, so a duplicated rule that drifts would be silently ignored.

[functions]
  directory = "netlify/functions"
