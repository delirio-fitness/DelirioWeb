<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />
    <meta name="robots" content="noindex" />
    <title>Opening the App Store — Delirio</title>
    <link rel="icon" type="image/svg+xml" href="/faviocn.svg" />
    <style>
      /*
        Everything here is inline on purpose. This page's whole job is to paint
        before it hands off, so it must not wait on a stylesheet, a webfont, or
        the 900KB app bundle.
      */
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        align-items: center;
        background: #090909;
        color: #f4f0e7;
        display: flex;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
        justify-content: center;
        margin: 0;
        padding: 24px;
        text-align: center;
      }
      .wrap { display: flex; flex-direction: column; align-items: center; gap: 28px; max-width: 420px; }
      svg { height: 46px; width: auto; }
      p {
        color: #b8b09e;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        line-height: 1.5;
        margin: 0;
        text-transform: uppercase;
      }
      .actions { display: flex; flex-direction: column; gap: 14px; width: 100%; }
      a {
        align-items: center;
        border: 1px solid #f4f0e7;
        border-radius: 6px;
        display: flex;
        font-size: 11px;
        font-weight: 700;
        justify-content: center;
        letter-spacing: 0.08em;
        min-height: 48px;
        padding: 12px 18px;
        text-decoration: none;
        text-transform: uppercase;
      }
      .primary { background: #f4f0e7; color: #121211; }
      .secondary { background: transparent; color: #f4f0e7; }
    </style>
  </head>

  <body>
    <div class="wrap">
      <!--
        Hand-copied from the catalog asset logo-brand_primary_white_v2 (the fill
        is recoloured to the page's off-white). Inline because this page must
        paint without waiting on a second request; that also means it cannot be
        pinned in .delirio-assets.lock — when that asset moves to v3, this path
        has to be re-copied by hand along with public/faviocn.svg.
      -->
      <svg viewBox="0 0 497.7888 700" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M238.0000 0.0000Q309.2324 0.0000 359.0951 16.7606Q408.9577 33.5211 439.5458 72.9577Q470.1338 112.3944 483.9613 179.9296Q497.7888 247.4648 497.7888 350.0000Q497.7888 452.5352 483.9613 520.0704Q470.1338 587.6056 439.5458 627.0423Q408.9577 666.4789 359.0951 683.2394Q309.2324 700.0000 238.0000 700.0000Q168.4437 700.0000 110.2007 697.0423Q51.9577 694.0845 0.0000 690.1408L0.0000 412.0009L150.0021 412.0009L150.0021 580.0032C150.0021 591.0494 158.9562 600.0035 170.0024 600.0035L200.0028 600.0035C223.2796 600.0035 242.8417 584.0977 248.4130 562.5623C248.6317 561.7166 248.8289 560.8624 249.0039 560.0000C249.6594 556.7698 250.0035 553.4265 250.0035 550.0028L250.0035 520.0024C250.0035 508.9562 258.9576 500.0021 270.0038 500.0021L275.0039 500.0021C302.6183 500.0021 325.0046 477.6158 325.0046 450.0014L325.0046 249.9986C325.0046 222.3842 302.6183 199.9979 275.0039 199.9979L270.0038 199.9979C258.9576 199.9979 250.0035 191.0438 250.0035 179.9976L250.0035 149.9972C250.0035 146.2240 249.5856 142.5483 248.7934 139.0141C248.6749 138.4854 248.5481 137.9599 248.4130 137.4377C242.8417 115.9023 223.2796 99.9965 200.0028 99.9965L170.0024 99.9965C158.9562 99.9965 150.0021 108.9506 150.0021 119.9968L150.0021 286.9991L0.0000 286.9991L0.0000 9.8592Q52.7958 5.9155 110.2007 2.9577Q167.6056 0.0000 238.0000 0.0000Z" fill="#f4f0e7"/>
      </svg>

      <p>Opening the App Store&hellip;</p>

      <div class="actions">
        <a class="primary" id="store" href="https://apps.apple.com/us/app/delirio-ai-personal-trainer/id6756231078">Open the App Store</a>
        <a class="secondary" href="/">Back to Delirio</a>
      </div>
    </div>

    <noscript>
      <meta http-equiv="refresh" content="0; url=https://apps.apple.com/us/app/delirio-ai-personal-trainer/id6756231078" />
    </noscript>

    <script>
      (function () {
        var STORE = 'https://apps.apple.com/us/app/delirio-ai-personal-trainer/id6756231078';

        // App Store Connect provider token for this developer account. Fixed
        // forever once minted (Apple has no way to regenerate it), and it is
        // not a secret — it is meant to travel in public campaign links, the
        // same as STORE above. Only the campaign token varies per source, so
        // /app/<token> can expand to a full link with just this constant.
        var PROVIDER_TOKEN = '128353303';

        var target;
        if (window.location.search) {
          // A full query string wins outright and is forwarded untouched, so
          // an explicit App Store Connect link (?pt=...&ct=...&mt=8, or
          // anything else, e.g. /app?src=tiktok) always reaches Apple intact.
          target = STORE + window.location.search;
        } else {
          // Short form for bio links: /app/<campaign token>, e.g. /app/iris.
          // pt and mt are constant, so only ct needs to travel in the URL.
          //
          // Requires the slash so this never fires for a direct hit on this
          // file's own name — Netlify serves /app.html as a literal static
          // asset (it matches neither the /app nor /app/* redirect rule), and
          // a looser match here previously turned that into ct=.html.
          var match = window.location.pathname.match(/^\/app\/(.+)$/);
          var token = match ? match[1] : '';
          target = token
            ? STORE + '?pt=' + PROVIDER_TOKEN + '&ct=' + encodeURIComponent(token) + '&mt=8'
            : STORE;
        }
        document.getElementById('store').href = target;

        // replace(), not href: /app never enters history, so Back from the App
        // Store web page skips this document instead of re-triggering it.
        //
        // Two frames first, so the browser has painted something. On iOS the
        // OS intercepts this navigation to open the App Store app and cancels
        // it here, which is exactly the case where an empty document would be
        // left on screen as a white page.
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            window.location.replace(target);
          });
        });

        // If we are still here after the user has been away, the handoff was
        // intercepted and this tab survived. Send it to the landing page so
        // returning to the browser shows Delirio rather than a holding screen.
        // Elsewhere the navigation commits, this document is discarded, and
        // this listener never runs.
        var wentAway = false;
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) {
            wentAway = true;
          } else if (wentAway) {
            window.location.replace('/');
          }
        });
      })();
    </script>
  </body>
</html>
